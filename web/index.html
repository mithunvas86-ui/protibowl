<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Proti Bowls — contactless dining & ordering.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Proti Bowls">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png"/>

  <title>Proti Bowls</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay checkout (online payment) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <!--
    Flutter web (CanvasKit) renders into a WebGL canvas. Two things can turn the
    whole app dark/black when this browser tab is switched away and back:

      1. The tab is backgrounded long enough that the browser drops the WebGL/GPU
         context ("webglcontextlost"). The canvas can't repaint and comes back
         black — a reload restores it cleanly.

      2. The common case: the tab is simply switched and the context is NOT lost,
         but Flutter pauses rendering while hidden and doesn't always repaint on
         return, leaving a stale black canvas. No "webglcontextlost" fires here,
         so the reload below never triggers. Dispatching a synthetic resize when
         the page becomes visible forces Flutter's engine to handle a metrics
         change and repaint the scene — without a reload, so cart/page state is
         preserved.
  -->
  <script>
    // Case 1: genuine GPU context loss after long backgrounding.
    window.addEventListener('webglcontextlost', function () {
      window.location.reload();
    }, true);

    // Case 2: quick tab switch — nudge Flutter to repaint on return.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        window.dispatchEvent(new Event('resize'));
      }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
